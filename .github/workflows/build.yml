name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.SNOOZE_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore de firma
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/snooze.jks"
          echo "SNOOZE_KEYSTORE_PATH=$RUNNER_TEMP/snooze.jks" >> "$GITHUB_ENV"

      - name: Compilar APK release
        env:
          SNOOZE_KEYSTORE_PASSWORD: ${{ secrets.SNOOZE_KEYSTORE_PASSWORD }}
          SNOOZE_KEY_ALIAS: ${{ secrets.SNOOZE_KEY_ALIAS }}
          SNOOZE_KEY_PASSWORD: ${{ secrets.SNOOZE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease lintRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk SnoozeTravel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SnoozeTravel-apk
          path: SnoozeTravel.apk

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SnoozeTravel.apk
          generate_release_notes: true
